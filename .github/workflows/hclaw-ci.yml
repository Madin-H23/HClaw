# HClaw 独立 CI（T1）：typecheck + vitest 单测。上游 ci.yml 保持零改动。
# 说明：verify 在 ubuntu-24.04（与上游一致）；test-windows 在 windows-latest
# 跑同一单测（#10-#15 适配批后基线 57→1，#16 豁免覆盖双平台）——产品目标平台
# 的回归面自此进 CI；打包见 package-windows（T8）。
name: HClaw CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: hclaw-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # format:check 需要 origin/develop 做分叉 diff（浅克隆取不到会退化为空跑）
          fetch-depth: 0

      # 共享类型镜像守卫（#21）：stream-event / image-detector / channel-prefixes /
      # channel-registry 四组 shared/ → src/、container/agent-runner/src/、web/src/
      # 镜像副本与规范源逐字节一致；改 shared/ 忘跑 make sync-types 在此拦截。
      # 放在安装依赖之前，漂移即快速失败。上游 ci.yml 的 make typecheck 先 sync
      # 再 check 恒绿，无法兜底，故必须在本 job 显式把关。
      - name: Check shared type mirror sync
        run: bash scripts/check-stream-event-sync.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            container/agent-runner/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix container/agent-runner ci

      - name: Typecheck (backend + desktop shell)
        run: |
          npm run typecheck
          npm run desktop:typecheck

      - name: Check changed-file formatting (lint)
        run: npm run format:check
        env:
          # 本仓库纪律：一切改造在 develop——lint 口径对 origin/develop 的分叉 diff 负责
          FORMAT_BASE_REF: origin/develop

      - name: Unit tests
        run: npm test -- --run

  test-windows:
    # #10-#15 适配批后 Windows 基线=仅 #16（豁免），产品目标平台的单测回归面进 CI。
    # 不跑 typecheck/format（平台中立，verify 已覆盖）；不跑 E2E（桌面面归打包冒烟）。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            container/agent-runner/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix container/agent-runner ci

      - name: Unit tests (Windows)
        run: npm test -- --run

  package-windows:
    # T8（ADR-0007）：Windows NSIS 打包 job——桌面壳 + 内嵌 server 一键安装包，
    # 产物以 artifact 供下载。加固三件套沿 verify job（actions 按 SHA 固定 /
    # workflow 级 contents: read / timeout + concurrency）。
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            container/agent-runner/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npm --prefix container/agent-runner ci

      # better-sqlite3 按 electron ABI 重编（prebuild 下载），打包后自动恢复
      # node ABI；electron 运行时复用 npm ci 装好的 node_modules/electron/dist
      #（electron-builder.yml electronDist），不重复下载。
      - name: Package NSIS installer (x64)
        run: npm run desktop:package:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HClaw-windows-x64-setup
          path: electron/release/*.exe
          if-no-files-found: error
